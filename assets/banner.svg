<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18" />
      <stop offset="50%" stop-color="#0c1729" />
      <stop offset="100%" stop-color="#091f2c" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <radialGradient id="orb-glow-1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orb-glow-2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.15); opacity: 0.65; }
      }
      @keyframes waveFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      @keyframes barPulse {
        0%, 100% { transform: scaleY(0.4); }
        50% { transform: scaleY(1.1); }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px); opacity: 0.3; }
        50% { transform: translateY(-15px); opacity: 0.8; }
      }
      @keyframes gridFade {
        0%, 100% { opacity: 0.08; }
        50% { opacity: 0.16; }
      }

      .bg-orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 240px 120px; }
      .bg-orb-2 { animation: pulseOrb 10s ease-in-out infinite 2s; transform-origin: 960px 280px; }
      .wave-animated { stroke-dasharray: 8, 12; animation: waveFlow 6s linear infinite; }
      .grid-pattern { animation: gridFade 6s ease-in-out infinite; }

      .eq-bar { transform-origin: bottom; animation: barPulse 2s ease-in-out infinite; }
      .eq-bar:nth-child(2) { animation-delay: 0.2s; }
      .eq-bar:nth-child(3) { animation-delay: 0.4s; }
      .eq-bar:nth-child(4) { animation-delay: 0.6s; }
      .eq-bar:nth-child(5) { animation-delay: 0.8s; }
      .eq-bar:nth-child(6) { animation-delay: 1.0s; }
      .eq-bar:nth-child(7) { animation-delay: 1.2s; }
      .eq-bar:nth-child(8) { animation-delay: 1.4s; }
      .eq-bar:nth-child(9) { animation-delay: 0.3s; }
      .eq-bar:nth-child(10) { animation-delay: 0.7s; }

      .particle-1 { animation: floatParticle 5s ease-in-out infinite 0.5s; }
      .particle-2 { animation: floatParticle 6s ease-in-out infinite 1.5s; }
      .particle-3 { animation: floatParticle 4.5s ease-in-out infinite 2.5s; }
      .particle-4 { animation: floatParticle 7s ease-in-out infinite 3.5s; }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Layer 1: Background Subtle Grid -->
  <g class="grid-pattern" stroke="#38bdf8" stroke-width="0.75">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="120" y1="0" x2="120" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="360" y1="0" x2="360" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="840" y1="0" x2="840" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1080" y1="0" x2="1080" y2="420" />
  </g>

  <!-- Layer 2: Glowing Animated Orbs in Background -->
  <circle class="bg-orb-1" cx="240" cy="120" r="280" fill="url(#orb-glow-1)" />
  <circle class="bg-orb-2" cx="960" cy="280" r="260" fill="url(#orb-glow-2)" />

  <!-- Layer 3: Dynamic Animated Waveforms (Ambient Speech & ECG Pulse) -->
  <g opacity="0.35" filter="url(#glow-filter)">
    <!-- ECG / Audio Stream Flow 1 -->
    <path class="wave-animated" d="M 0 340 Q 150 320 280 345 T 560 330 T 780 350 T 1000 335 T 1200 340"
          fill="none" stroke="#0ea5e9" stroke-width="2.5" />
    <!-- Secondary Harmonizing Wave -->
    <path class="wave-animated" d="M 0 360 Q 180 380 340 355 T 680 370 T 920 350 T 1200 365"
          fill="none" stroke="#10b981" stroke-width="2" />
  </g>

  <!-- Audio Equalizer Bars (Ambient Voice Activity Visualization - Bottom Right) -->
  <g transform="translate(1010, 360)" opacity="0.45" fill="#38bdf8">
    <rect class="eq-bar" x="0" y="-30" width="4" height="30" rx="2" />
    <rect class="eq-bar" x="8" y="-45" width="4" height="45" rx="2" />
    <rect class="eq-bar" x="16" y="-60" width="4" height="60" rx="2" />
    <rect class="eq-bar" x="24" y="-35" width="4" height="35" rx="2" />
    <rect class="eq-bar" x="32" y="-70" width="4" height="70" rx="2" fill="#34d399" />
    <rect class="eq-bar" x="40" y="-50" width="4" height="50" rx="2" fill="#34d399" />
    <rect class="eq-bar" x="48" y="-65" width="4" height="65" rx="2" />
    <rect class="eq-bar" x="56" y="-40" width="4" height="40" rx="2" />
    <rect class="eq-bar" x="64" y="-55" width="4" height="55" rx="2" />
    <rect class="eq-bar" x="72" y="-25" width="4" height="25" rx="2" />
  </g>

  <!-- Floating Ambient Particles (Subtle) -->
  <circle class="particle-1" cx="150" cy="90" r="3" fill="#38bdf8" />
  <circle class="particle-2" cx="320" cy="50" r="2" fill="#34d399" />
  <circle class="particle-3" cx="1060" cy="110" r="3.5" fill="#818cf8" />
  <circle class="particle-4" cx="890" cy="70" r="2.5" fill="#38bdf8" />

  <!-- Layer 4: FOREGROUND CONTENT (Guaranteed 100% visible, sharp, and uninterrupted) -->
  <g class="foreground-content" filter="url(#shadow)">

    <!-- Top Badge Pill -->
    <g transform="translate(70, 48)">
      <rect width="395" height="32" rx="16" fill="#0f283d" stroke="#0284c7" stroke-width="1.2" />
      <!-- Pulsing Dot -->
      <circle cx="20" cy="16" r="5" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="35" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
            font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">
        AMBIENT CLINICAL AI &amp; CHART SYNTHESIS
      </text>
    </g>

    <!-- Main Title -->
    <text x="70" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Specialized Medical Notetaking
    </text>
    <text x="70" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="42" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.5">
      &amp; Chart Synthesis Ecosystem 🩺⚡
    </text>

    <!-- Subtitle -->
    <text x="70" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="17" font-weight="400" fill="#94a3b8">
      Curated index of enterprise ambient scribes, self-hosted speech models &amp; clinical NLP chart automation pipelines.
    </text>

    <!-- Feature Tags / Pills Row -->
    <g transform="translate(70, 275)">
      <!-- Pill 1: Ambient Scribe -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif"
              font-size="13" font-weight="600" fill="#e2e8f0">🎙️ Ambient Scribes</text>
      </g>

      <!-- Pill 2: Real-time Notes -->
      <g transform="translate(195, 0)">
        <rect width="195" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif"
              font-size="13" font-weight="600" fill="#e2e8f0">⚡ Speech-to-SOAP</text>
      </g>

      <!-- Pill 3: Coding & ICD-10 -->
      <g transform="translate(405, 0)">
        <rect width="200" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif"
              font-size="13" font-weight="600" fill="#e2e8f0">🏷️ ICD-10 / CPT Coding</text>
      </g>

      <!-- Pill 4: Open-Source Stacks -->
      <g transform="translate(620, 0)">
        <rect width="215" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif"
              font-size="13" font-weight="600" fill="#e2e8f0">💻 100% Private Self-Hosted</text>
      </g>

      <!-- Pill 5: EHR Integration -->
      <g transform="translate(850, 0)">
        <rect width="195" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif"
              font-size="13" font-weight="600" fill="#e2e8f0">🏥 EHR &amp; FHIR Ready</text>
      </g>
    </g>

    <!-- Bottom Metadata Bar -->
    <g transform="translate(70, 356)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif"
            font-size="12" font-weight="500" fill="#64748b">
        Updated October 2026 • Verified SaaS Pricing &amp; Open-Source Star Counts • HIPAA &amp; HITRUST Compliant Systems
      </text>
    </g>
  </g>

  <!-- Decorative Outer Border -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="15.5" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.6" />
</svg>
